# Barrier configuration: MacBook keyboard + trackpad driving a Windows PC.
#
# The MacBook is the SERVER (it owns the physical keyboard and trackpad).
# The Windows PC is the CLIENT (it receives the input).
#
# Run on the MacBook:  barriers --name mac -c <this file> -f
# Run on Windows:      barrierc.exe --name windows <macbook-ip>
#
# The --name values below must match the screen names in this file exactly.
# Using explicit short names avoids depending on either machine's hostname.

section: screens
	# The MacBook. Nothing to configure here: this is where the keyboard is.
	mac:

	windows:
		# Swap Command and Control so Mac muscle memory keeps working on the
		# PC. Cmd+C on the MacBook arrives at Windows as Ctrl+C; Control on the
		# MacBook arrives as the Windows key.
		#
		# On macOS the Command key is reported as "super" (OSXKeyState maps
		# kCGEventFlagMaskCommand to KeyModifierSuper), which is why the swap
		# is written in terms of super rather than meta.
		#
		# Delete these two lines if you would rather the keys pass through
		# unchanged, i.e. Cmd stays the Windows key and Control stays Control.
		super = ctrl
		ctrl  = super

		# Windows treats CapsLock/NumLock/ScrollLock as ordinary keys, so the
		# half-duplex workarounds some Mac keyboards need are not wanted here.
		halfDuplexCapsLock   = false
		halfDuplexNumLock    = false
		halfDuplexScrollLock = false
end

section: aliases
	# The server is started with a screen name, and it must match a screen
	# above. The Barrier GUI defaults that field to the machine's hostname,
	# so without these aliases it fails with:
	#     FATAL: unknown screen name `<your-hostname>'
	#
	# Add your own hostname here if it differs -- `hostname` and `hostname -s`
	# on the Mac, and the PC's name on Windows.
	mac:
		gabis-Air.lan
		gabis-Air
		localhost

	windows:
		windows-pc
end

section: links
	# Physical arrangement: the PC's monitor sits to the RIGHT of the MacBook.
	# Swap right/left below if it actually sits on the other side.
	mac:
		right = windows

	windows:
		left  = mac
end

section: options
	# Share the clipboard. This was off while the clipboard parser was the
	# unfixed one: IClipboard::unmarshall had no bounds checks at all, and the
	# chunk assembler would accumulate without limit. Both are fixed now
	# (lengths validated against the buffer, 32 MB cap, per-connection
	# reassembly), so the feature is worth having back.
	#
	# Set to false if you would rather keep the attack surface off entirely.
	clipboardSharing = true

	# Keep the link live and notice a dead peer quickly (milliseconds).
	heartbeat = 5000

	# Send mouse movement as relative deltas instead of absolute positions
	# while the cursor is locked to a screen (the hotkeys below do that).
	#
	# This is what makes phone "remote mouse" apps feel smooth: a delta is
	# self-correcting, so a packet lost or delayed by Wi-Fi just means the
	# cursor moves slightly less and the next one makes it up. Absolute
	# positions are not -- a stalled link replays every stale coordinate and
	# the cursor visibly slides through where it used to be.
	relativeMouseMoves = true

	# Require a deliberate push against the screen edge before the pointer
	# crosses, so a stray trackpad flick does not send keystrokes to the PC.
	switchDelay = 250

	# Primary way to move between machines. These work from either screen and
	# do not care how the displays are physically arranged, which edge
	# switching very much does.
	#
	#     Cmd + Control + Right  ->  Windows PC
	#     Cmd + Control + Left   ->  MacBook
	#
	# Not Cmd+Shift+Arrow: macOS uses that for "select to start/end of line"
	# in every text field, and Barrier would swallow it.
	# Locking the cursor to the target screen does two things: it stops the
	# pointer wandering across a screen edge by accident, and it is what
	# enables relativeMouseMoves above.
	#
	# An explicit switchToScreen is not blocked by the lock
	# (Server::handleSwitchToScreenEvent calls jumpToScreen with no lock
	# check), so these always work and you cannot get stranded.
	keystroke(super+control+right) = switchToScreen(windows), lockCursorToScreen(on)
	keystroke(super+control+left)  = switchToScreen(mac), lockCursorToScreen(off)

	# Do not let the server's screensaver blank the PC and vice versa.
	screenSaverSync = false
end
